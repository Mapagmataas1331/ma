<text x="56" y="76" font-size="34" font-weight="700" fill="#e8ecf8">Reverse proxy and control plane</text>
<text x="56" y="112" font-size="20" fill="#9aa6c8">Components from the project README and deployment files</text>
<rect x="56" y="330" width="250" height="170" rx="18" fill="#18203a" stroke="#9aa6c8" stroke-width="2"/><rect x="56" y="330" width="6" height="170" rx="3" fill="#9aa6c8" opacity=".9"/><text x="82" y="370" font-size="25" font-weight="650" fill="#e8ecf8">Internet</text><text x="82" y="406" font-size="19" fill="#9aa6c8">browsers, API clients,</text><text x="82" y="436" font-size="19" fill="#9aa6c8">Minecraft + voice chat</text><rect x="380" y="170" width="800" height="660" rx="26" fill="none" stroke="#3a4a78" stroke-width="2" stroke-dasharray="10 8"/><text x="404" y="206" font-size="19" fill="#9aa6c8">Oracle Cloud VM · Ubuntu 24.04 ARM64 · systemd</text><rect x="420" y="240" width="320" height="250" rx="18" fill="#18203a" stroke="#7aa2ff" stroke-width="2"/><rect x="420" y="240" width="6" height="250" rx="3" fill="#7aa2ff" opacity=".9"/><text x="446" y="280" font-size="25" font-weight="650" fill="#e8ecf8">Caddy (edge)</text><text x="446" y="316" font-size="19" fill="#9aa6c8">:80 / :443  HTTP(S), TLS</text><text x="446" y="346" font-size="19" fill="#9aa6c8">:25565  TCP  Minecraft</text><text x="446" y="376" font-size="19" fill="#9aa6c8">:24454  UDP  voice chat</text><text x="446" y="406" font-size="19" fill="#9aa6c8">only public entry point</text><rect x="820" y="240" width="320" height="200" rx="18" fill="#18203a" stroke="#5fd4b0" stroke-width="2"/><rect x="820" y="240" width="6" height="200" rx="3" fill="#5fd4b0" opacity=".9"/><text x="846" y="280" font-size="25" font-weight="650" fill="#e8ecf8">Go control plane</text><text x="846" y="316" font-size="19" fill="#9aa6c8">localhost:8080</text><text x="846" y="346" font-size="19" fill="#9aa6c8">JWT auth, users, roles</text><text x="846" y="376" font-size="19" fill="#9aa6c8">health, metrics, logs</text><rect x="820" y="580" width="320" height="190" rx="18" fill="#18203a" stroke="#5fd4b0" stroke-width="2"/><rect x="820" y="580" width="6" height="190" rx="3" fill="#5fd4b0" opacity=".9"/><text x="846" y="620" font-size="25" font-weight="650" fill="#e8ecf8">PostgreSQL</text><text x="846" y="656" font-size="19" fill="#9aa6c8">+ TimescaleDB</text><text x="846" y="686" font-size="19" fill="#9aa6c8">request logs, metrics</text><text x="846" y="716" font-size="19" fill="#9aa6c8">30-day retention</text><rect x="420" y="590" width="320" height="170" rx="18" fill="#18203a" stroke="#f0b860" stroke-width="2"/><rect x="420" y="590" width="6" height="170" rx="3" fill="#f0b860" opacity=".9"/><text x="446" y="630" font-size="25" font-weight="650" fill="#e8ecf8">Minecraft (cloud)</text><text x="446" y="666" font-size="19" fill="#9aa6c8">127.0.0.1:25566</text><text x="446" y="696" font-size="19" fill="#9aa6c8">Java 21, systemd</text><rect x="1260" y="240" width="290" height="200" rx="18" fill="#18203a" stroke="#f0b860" stroke-width="2" stroke-dasharray="8 7"/><rect x="1260" y="240" width="6" height="200" rx="3" fill="#f0b860" opacity=".9"/><text x="1286" y="280" font-size="25" font-weight="650" fill="#e8ecf8">Home server</text><text x="1286" y="316" font-size="19" fill="#9aa6c8">Minecraft + voice</text><text x="1286" y="346" font-size="19" fill="#9aa6c8">fallback target</text><rect x="1260" y="560" width="290" height="200" rx="18" fill="#18203a" stroke="#9aa6c8" stroke-width="2" stroke-dasharray="8 7"/><rect x="1260" y="560" width="6" height="200" rx="3" fill="#9aa6c8" opacity=".9"/><text x="1286" y="600" font-size="25" font-weight="650" fill="#e8ecf8">Home gateway</text><text x="1286" y="636" font-size="19" fill="#9aa6c8">/proxy/* upstream</text><text x="1286" y="666" font-size="19" fill="#9aa6c8">over WireGuard /</text><text x="1286" y="696" font-size="19" fill="#9aa6c8">Tailscale tunnel</text><line x1="306" y1="415" x2="418" y2="365" stroke="#9aa6c8" stroke-width="2.5" marker-end="url(#a9aa6c8)"/><text x="181" y="312" font-size="18" fill="#9aa6c8" text-anchor="middle">HTTPS · TCP · UDP</text><line x1="740" y1="330" x2="818" y2="330" stroke="#7aa2ff" stroke-width="2.5" marker-end="url(#a7aa2ff)"/><text x="779.0" y="318.0" font-size="18" fill="#7aa2ff" text-anchor="middle">API</text><line x1="980" y1="440" x2="980" y2="578" stroke="#5fd4b0" stroke-width="2.5" marker-end="url(#a5fd4b0)"/><text x="966" y="470" font-size="18" fill="#5fd4b0" text-anchor="end">SQL</text><line x1="580" y1="490" x2="580" y2="588" stroke="#f0b860" stroke-width="2.5" marker-end="url(#af0b860)"/><text x="600" y="545" font-size="18" fill="#f0b860" text-anchor="start">cloud first</text><polyline points="742,470 1205,500 1205,340 1256,340" fill="none" stroke="#f0b860" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#af0b860)"/><text x="996" y="545" font-size="18" fill="#f0b860" text-anchor="start">failover to home</text><line x1="1140" y1="690" x2="1258" y2="690" stroke="#9aa6c8" stroke-width="2.5" marker-end="url(#a9aa6c8)" stroke-dasharray="9 8"/><text x="1199.0" y="678.0" font-size="18" fill="#9aa6c8" text-anchor="middle">/proxy/*</text><text x="56" y="866" font-size="17" fill="#9aa6c8">Data plane: Caddy forwards raw TCP/UDP. Control plane: Go API on localhost only. Home IP stays private.</text>
</svg>
