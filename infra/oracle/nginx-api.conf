# API reverse proxy for api.ma.cyou.
#
# CORS credentialed allowlist lives in the Go app (CORS_ORIGINS / httpx.CORS).
# Do not add Access-Control-* here - nginx wildcards would fight the app allowlist.
#
# Require in http {}:
#   include /path/to/nginx-upgrade.conf;   # defines $connection_upgrade for WebSocket
#
# TLS: this tree ships :80 only. Terminate TLS with certbot (or enable the
# commented :443 block after certificates exist), then send HSTS on HTTPS.
# Deploy: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.ma.cyou;

    client_max_body_size 5g;

    # Let's Encrypt HTTP-01 (certbot webroot). Keep ahead of the proxy location.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    # Everything, including the Open Graph cards (GET /v1/og?site=…, alias /og.png), goes to Go.
    # The cards are cached in-process and sent with Cache-Control/ETag, so no nginx cache is needed.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Edge security headers (no HSTS on plaintext HTTP).
        # always: also attach on proxied / non-2xx responses; do not break /healthz or OPTIONS.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }
}

