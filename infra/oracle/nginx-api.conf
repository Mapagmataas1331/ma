# API reverse proxy for api.ma.cyou (matches the live config on the Oracle host).
#
# CORS credentialed allowlist lives in the Go app (CORS_ORIGINS / httpx.CORS).
# Do not add Access-Control-* here - nginx wildcards would fight the app allowlist.
#
# Require in http {}:
#   include /path/to/nginx-upgrade.conf;   # defines $connection_upgrade for WebSocket
#   (live: /etc/nginx/conf.d/connection-upgrade.conf)
#
# TLS: certbot-managed certificates (renewal: nginx authenticator; ACME webroot
# also served on :80). First issue, e.g.:
#   sudo certbot certonly --webroot -w /var/www/html -d api.ma.cyou
# Deploy: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.ma.cyou;

    # Let's Encrypt HTTP-01 (certbot webroot). Keep ahead of the redirect.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.ma.cyou;

    ssl_certificate     /etc/letsencrypt/live/api.ma.cyou/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.ma.cyou/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 5g;

    # Everything, including Open Graph cards (GET /v1/og?site=..., alias /og.png), goes to Go.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Go (httpx.SecurityHeaders) sends the same values; hide its copies so the
        # edge emits exactly one of each (duplicate HSTS fails hstspreload.org).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }
}
